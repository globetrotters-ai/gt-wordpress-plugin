name: Bug report
description: Something the plugin does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The request (path, method, user agent) or admin action, and its response or error.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.13.0"
    validations:
      required: true
  - type: input
    id: wp
    attributes:
      label: WordPress and PHP versions
      placeholder: "WordPress 6.8, PHP 8.3"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host, page-cache and security plugins, proxy or CDN, object cache. Leave out your site URL and tokens if you prefer.
