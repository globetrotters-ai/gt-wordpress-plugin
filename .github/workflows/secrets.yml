name: Secrets

# gitleaks over the full history of the commit under test. Called by CI
# (so the ci-ok gate covers pull requests and main) and by the release
# workflow; also run on its own for every branch push, so a branch with no
# pull request is scanned too. The pinned binary rather than gitleaks-action,
# which needs a paid licence for organisation repos. .gitleaks.toml allowlists
# only the test fixtures' fake tokens.

on:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # The full history of the commit under test (on a pull request, the
      # merge commit: both sides). Not every fetched ref: a leak on one
      # unrelated branch must fail that branch, not every other run.
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts=HEAD .'
